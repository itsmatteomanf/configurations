services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    entrypoint: cloudflared tunnel --no-autoupdate run --token
      ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in .env}
    restart: unless-stopped
    networks:
      online:
      macvlan:
        ipv4_address: 10.13.0.254
        ipv6_address: 2a01:4f8:2201:ff00:eeee:ffff:0a0d:00fe

networks:
  online:
    name: online
    external: true
  macvlan:
    name: macvlan-network
    external: true
