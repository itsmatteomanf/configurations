services:
  traefik:
    container_name: traefik-backend
    image: traefik:v3.0
    restart: unless-stopped
    network_mode: 'service:tailscale'
    depends_on:
      - tailscale
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/config/containers/traefik/:/etc/traefik/
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?Set CF_DNS_API_TOKEN in .env}
  tailscale:
    container_name: traefik-tailscale
    image: tailscale/tailscale
    hostname: traefik-cosmo
    environment:
      TS_AUTHKEY: tskey-auth-kx4C7UHMa721CNTRL-iYFSrxqdkeZ5RMVWZAzpgZKsrxVkwFRER
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: false
    volumes:
      - /mnt/config/containers/tailscale/traefik/state:/var/lib/tailscale
      - /mnt/config/containers/tailscale/traefik/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    sysctls:
      # - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    restart: unless-stopped
    networks:
      macvlan:
        ipv4_address: 10.13.0.252
        ipv6_address: 2a01:4f8:2201:ff00:eeee:ffff:0a0d:00fc

networks:
  online:
    name: online
    external: true
  macvlan:
    name: macvlan-network
    external: true
