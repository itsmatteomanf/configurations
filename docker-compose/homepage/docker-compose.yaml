services:
  homepage:
    container_name: homepage-backend
    image: ghcr.io/gethomepage/homepage:latest
    network_mode: 'service:tailscale'
    volumes:
      - /mnt/config/containers/homepage/config:/app/config # Make sure your local config directory exists
      - /mnt/config/containers/homepage/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations
    restart: unless-stopped

  tailscale:
    container_name: homepage-tailscale
    image: tailscale/tailscale
    hostname: homepage
    environment:
      TS_ACCEPT_DNS: true
      TS_AUTHKEY: tskey-auth-kB6Ff14CNTRL-66MPoEsrsSLD1fte5TzTRLvWL5vQozV2
      TS_SERVE_CONFIG: /config/homepage.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: false
      TS_EXTRA_ARGS: --accept-routes
    volumes:
      - /mnt/config/containers/tailscale/homepage/state:/var/lib/tailscale
      - /mnt/config/containers/tailscale/homepage/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    sysctls:
      # - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    restart: unless-stopped
    networks:
      default:
      macvlan:
        ipv4_address: 10.13.0.250
        ipv6_address: 2a01:4f8:2201:ff00:eeee:ffff:0a0d:00fa

networks:
  online:
    name: online
    external: true
  macvlan:
    name: macvlan-network
    external: true
